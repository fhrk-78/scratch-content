<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="471.44888" height="349.94784" viewBox="0,0,471.44888,349.94784"><g transform="translate(-3.94431,-2.54065)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" font-size="40" text-anchor="start" style="mix-blend-mode: normal"><text transform="translate(5.10418,16.95612) scale(0.33139,0.33139)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">だいたいのメソッドは文字列を先頭から走査して処理してるんだけど、</tspan><tspan x="0" dy="48px">1文字ずつリストに分けて処理していくって形の方がワンチャン自由度高い</tspan><tspan x="0" dy="48px">可能性があったなと作った後から後悔。</tspan><tspan x="0" dy="48px">でもリストって個数制限あるしこれがいいよね。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">そもそもXMLパーサーを作る時に「標準ライブラリ弱スギィ！」と</tspan><tspan x="0" dy="48px">思ってこのライブラリを作ったんだけど、思った数倍は時間かけてしまった。</tspan><tspan x="0" dy="48px">Scratchって限られたブロックで処理を実現するって点は</tspan><tspan x="0" dy="48px">Brainf**kに似てるなと思う。Brainf**kより一億倍簡単だけど。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">ところで、分かる人は分かると思うけど、このライブラリのメソッドは</tspan><tspan x="0" dy="48px">java.lang.Stringのメンバ関数を参考にしたよ。</tspan><tspan x="0" dy="48px">最近は某ブロック積み上げゲームのサーバーのプラグイン開発に</tspan><tspan x="0" dy="48px">ハマっているせいでJavaをだいぶ使い込んでて、やっぱり定義は不便。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">ちなみにこの説明の英語は自分で書いたヤツ。ところどころ怪しいところが</tspan><tspan x="0" dy="48px">あったらそれは人力翻訳が原因。○検は準2級です。</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">810の日のちょっと前に作り始めてようやっと完成。</tspan><tspan x="0" dy="48px">後書きが随分と長くなっちゃったけど、ぜひ使ってね♡</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">2026/8/12 fhrk_7 p.s.Scratchの日本語フォント読みづらい。サンセリフが良い</tspan></text></g></g></svg>